{% extends "base.html" %}

{% block title %}Edit review{% endblock %}

{% block content %}
<main class="container">
  <h1>Edit your review for {{ game.title }}</h1>

  <form method="post" class="review-edit-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="game-review__action-button">Save changes</button>
  </form>

  <p>
    <a href="{% url 'game_detail' game.slug %}">Back to game</a>
  </p>
</main>
{% endblock %}
